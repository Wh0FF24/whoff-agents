customHeaders:
  - pattern: 'fonts/*'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: 'img/*'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
  - pattern: 'icons/*'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
  - pattern: '**/*'
    headers:
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
